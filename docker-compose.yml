# Local stack (README §12). Migrations and seed run from the host, mirroring production where
# GitHub Actions runs them, never the app at startup.
# Credentials come only from the gitignored .env (generate with: openssl rand -hex 16). Compose refuses to start without one.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creditdesk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d creditdesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    environment:
      DATABASE_URL: Host=postgres;Port=5432;Database=creditdesk;Username=desk;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
