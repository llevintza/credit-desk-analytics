name: Pages

# ADR-0024: the Angular front end on GitHub Pages (https://llevintza.github.io/credit-desk-analytics/), calling
# the Render API cross-origin with bearer tokens. Render keeps serving the same SPA from wwwroot (deploy.yml).
# Needs, set by hand: Settings → Pages → Source = GitHub Actions; a repository variable APP_URL (the API origin,
# e.g. https://<service>.onrender.com, not a secret); and that origin's CORS_ALLOWED_ORIGINS on Render including
# https://llevintza.github.io.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One Pages deployment at a time. A queued run waits rather than cancelling the one in flight, so a deployment is
# never cut off halfway; GitHub keeps only the newest pending run, so the latest main always ends up deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a deploy builds from the lockfile alone.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the API origin (vars.APP_URL)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          api="${APP_URL%/}"
          # Scheme and host (and port) only: it goes into the bundle, the CSP and a sed expression below.
          if [[ ! "$api" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Set the repository variable APP_URL to the API's https origin (no path); got '${APP_URL}'."
            exit 1
          fi
          echo "API_ORIGIN=$api" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Build for /credit-desk-analytics/ against the API origin
        run: npx ng build --base-href /credit-desk-analytics/ --define "DESK_API_BASE_URL=\"$API_ORIGIN\""
      - name: Meta CSP and the deep-link fallback
        working-directory: web/dist/web/browser
        run: |
          # Pages can't send response headers, so the app's CSP (SecurityHeaders.AppCsp) goes in a meta tag, with the
          # API origin added to connect-src. frame-ancestors is ignored in a meta tag (ADR-0024 consequences).
          csp="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'"
          sed -i "s|<meta charset=\"utf-8\">|&\n  <meta http-equiv=\"Content-Security-Policy\" content=\"${csp}\">|" index.html
          grep -q 'http-equiv="Content-Security-Policy"' index.html
          grep -q '<base href="/credit-desk-analytics/">' index.html
          # Pages answers an unknown path with 404.html: the same shell, so the router opens deep links.
          cp index.html 404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish: Pages write and the OIDC token deploy-pages exchanges for it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
