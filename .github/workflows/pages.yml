name: Pages

# ADR-0024: the Angular front end on GitHub Pages (https://llevintza.github.io/credit-desk-analytics/), calling
# the Render API cross-origin with bearer tokens. Render keeps serving the same SPA from wwwroot (deploy.yml).
# Gated like deploy.yml (README §14.2): it runs only after CI succeeded on a push to main in this repository, and
# only for the commit that is still the tip of main, which is the commit it checks out and builds.
# Needs, set by hand: Settings → Pages → Source = GitHub Actions; a repository variable APP_URL (the API origin,
# e.g. https://<service>.onrender.com, not a secret); and that origin's CORS_ALLOWED_ORIGINS on Render including
# https://llevintza.github.io.
#
# Action pins added by this workflow, for checking against upstream (each tag is a plain commit tag):
#   actions/upload-pages-artifact v5.0.0 (released 2026-04-10) = fc324d3547104276b827a68afc52ff2a11cc49c9
#     gh api repos/actions/upload-pages-artifact/git/ref/tags/v5.0.0 --jq .object.sha
#   actions/deploy-pages v5.0.1 (released 2026-09-01) = 368f82528645a54fb793d4d04e342629a3f51346
#     gh api repos/actions/deploy-pages/git/ref/tags/v5.0.1 --jq .object.sha
# checkout and setup-node use the same pins as ci.yml.
on:
  # workflow_run.branches matches the triggering run's head_branch, which a pull_request run from a branch named
  # main also has: the gate job checks the event, branch, repository and tip itself.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One Pages deployment at a time. A queued run waits rather than cancelling the one in flight, so a deployment is
# never cut off halfway; GitHub keeps only the newest pending run, so the latest main always ends up deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # As deploy.yml's gate: no environment, no secrets. A green CI run for a commit that is no longer the tip of
  # main is skipped (the tip's own run publishes); a dispatch is allowed from refs/heads/main only.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.tip.outputs.allowed }}
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - name: Require exact main tip
        id: tip
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ "$REF" != refs/heads/main ]; then
                echo "::error::Pages dispatch is only allowed from refs/heads/main (this run is $REF)."
                exit 1
              fi
              ;;
            workflow_run)
              if [ "$HEAD_BRANCH" != main ]; then
                echo "::error::Pages workflow_run is only allowed for head_branch main (this run is $HEAD_BRANCH)."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected event $EVENT_NAME"
              exit 1
              ;;
          esac
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/heads/main" --jq .sha)
          if [ -z "$tip" ] || [ "$tip" = null ]; then
            echo "::error::Could not resolve the current tip of main."
            exit 1
          fi
          if [ "$SHA" != "$tip" ]; then
            echo "::warning::Nothing published: $SHA is not the tip of main ($tip). The tip's own CI run publishes it."
            {
              echo "### Pages skipped: ${SHA:0:7} is not the tip of main"
              echo "Nothing was built or published by this run. The current tip is \`${tip:0:7}\`; its own CI run triggers its Pages run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }} # the commit CI passed, not whatever main is by now
          persist-credentials: false
      # No dependency cache: a deploy builds from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the API origin (vars.APP_URL)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          api="${APP_URL%/}"
          # Scheme and host (and port) only: it goes into the bundle, the CSP and a sed expression below.
          if [[ ! "$api" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::Set the repository variable APP_URL to the API's https origin (no path); got '${APP_URL}'."
            exit 1
          fi
          echo "API_ORIGIN=$api" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Build for /credit-desk-analytics/ against the API origin
        run: |
          npx ng build --base-href /credit-desk-analytics/ --define "DESK_API_BASE_URL=\"$API_ORIGIN\""
          # A missing or renamed define still builds, as a shell that calls its own origin: fail instead.
          grep -qF "$API_ORIGIN" dist/web/browser/main-*.js || { echo "::error::$API_ORIGIN is not in the bundle (DESK_API_BASE_URL define)."; exit 1; }
      - name: Meta CSP and the deep-link fallback
        working-directory: web/dist/web/browser
        run: |
          # Pages can't send response headers, so the app's CSP (SecurityHeaders.AppCsp) goes in a meta tag, with the
          # API origin added to connect-src. frame-ancestors is ignored in a meta tag (ADR-0024 consequences).
          csp="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'"
          sed -i "s|<meta charset=\"utf-8\">|&\n  <meta http-equiv=\"Content-Security-Policy\" content=\"${csp}\">|" index.html
          grep -q 'http-equiv="Content-Security-Policy"' index.html
          grep -q '<base href="/credit-desk-analytics/">' index.html
          # Pages answers an unknown path with 404.html: the same shell, so the router opens deep links.
          cp index.html 404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can publish: Pages write and the OIDC token deploy-pages exchanges for it.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
