name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel an in-progress run on main; PR runs may cancel superseded SHAs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Explicit `bash` is `bash --noprofile --norc -eo pipefail`. The unspecified default
# (`bash -e`) ignores a failing command on the left of `|`, so seeder exit 1/2
# piped to `tee` would not fail the step.
defaults:
  run:
    shell: bash

jobs:
  changes:
    # #169: the areas a PR touches, so heavy jobs run only when needed. There is no
    # workflow-level paths filter: skipped jobs keep their names and still report.
    # A heavy job skips only when its flag is exactly 'false'. On push, on a base
    # without the classifier, or if this job fails, the flags are empty and every
    # job runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      api: ${{ steps.classify.outputs.api }}
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      app: ${{ steps.classify.outputs.app }}
      perf: ${{ steps.classify.outputs.perf }}
      run_api: ${{ steps.classify.outputs.run_api }}
      run_web: ${{ steps.classify.outputs.run_web }}
      run_db_tools: ${{ steps.classify.outputs.run_db_tools }}
      run_compose_smoke: ${{ steps.classify.outputs.run_compose_smoke }}
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
      run_budgets: ${{ steps.classify.outputs.run_budgets }}
      run_coverage: ${{ steps.classify.outputs.run_coverage }}
    steps:
      - if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: echo "Not a pull request ($EVENT_NAME), so every job runs." >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The classifier comes from BASE_SHA, never the PR head, so a PR cannot
      # rewrite the rules that decide what it runs.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CLASSIFIER=_base/.github/scripts/ci-changes.mjs
          if [ ! -f "$CLASSIFIER" ]; then
            echo "::notice::BASE_SHA ${BASE_SHA} has no ${CLASSIFIER#_base/}; every job runs."
            echo "BASE_SHA has no classifier: every job runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node "$CLASSIFIER" --base "$BASE_SHA" --head "$HEAD_SHA"

  secrets:
    # Fails on any credential in ANY commit of the branch, not just the final tree (.gitleaks.toml).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Image pin tracked in deploy/ci-images/gitleaks/Dockerfile for Dependabot.
      - name: gitleaks (full history of this SHA)
        run: >
          docker run --rm -v "$PWD":/repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner -v --log-opts=HEAD

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image pin tracked in deploy/ci-images/actionlint/Dockerfile for Dependabot.
      - name: actionlint
        run: >
          docker run --rm -v "$PWD":/repo -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      # Image pin tracked in deploy/ci-images/shellcheck/Dockerfile for Dependabot.
      - name: shellcheck
        run: >
          docker run --rm -v "$PWD":/repo -w /repo
          koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
          --severity=warning
          deploy/start.sh perf/pipefail-demo.sh

  api:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        # Ephemeral, job-local database: trust auth, so no password exists anywhere.
        env:
          POSTGRES_DB: creditdesk
          POSTGRES_USER: desk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk -d creditdesk"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DATABASE_URL: Host=localhost;Port=5432;Database=creditdesk;Username=desk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build -c Release
      - name: Test with cobertura coverage
        run: |
          mkdir -p TestResults/coverage
          for proj in tests/Desk.Api.Tests tests/Desk.Data.Tests tests/Desk.Seeder.Tests; do
            name=$(basename "$proj")
            # Generated OpenAPI XML-comment support is [GeneratedCode] and
            # *.generated.cs (PDB path is not under obj/ unless emitted). Do not
            # pass CompilerGeneratedAttribute: that strips Program.cs lambdas.
            # tests/testconfig.json is authoritative for exclude-by-attribute
            # so coverlet.MTP CLI defaults (which include CompilerGenerated) are not merged.
            # Do not use `dotnet test --collect "XPlat Code Coverage"` (VSTest).
            dotnet test "$proj" -c Release --no-build -- \
              --coverlet \
              --coverlet-output-format cobertura \
              --coverlet-file-prefix "$name" \
              --coverlet-include '[Desk.*]*' \
              --coverlet-exclude-by-file '**/obj/**' \
              --coverlet-exclude-by-file '**/*.generated.cs' \
              --coverlet-exclude-assemblies-without-sources MissingAll \
              --results-directory "$PWD/TestResults/coverage"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dotnet
          path: TestResults/coverage
          if-no-files-found: error
      - name: No pending model changes (README §14.4)
        run: dotnet ef migrations has-pending-model-changes --project src/Desk.Data --startup-project src/Desk.Data
      # Rehearse the deploy pipeline's database steps on a throwaway Postgres.
      - uses: ./.github/actions/build-db-tools
      - name: Migrate (twice; the second run must be a no-op)
        run: ./dbtools/efbundle && ./dbtools/efbundle
      - name: Seed, then confirm --if-changed skips
        run: |
          ./dbtools/seeder/Desk.Seeder --if-changed --scale 0.1 | tee seed1.txt
          ./dbtools/seeder/Desk.Seeder --if-changed --scale 0.1 | tee seed2.txt
          grep -q '^SEED_ACTION=seeded' seed1.txt
          grep -q '^SEED_ACTION=skipped' seed2.txt

  web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Job-level defaults.run replaces workflow-level defaults.run entirely, so
    # shell: bash (pipefail) must be repeated here with working-directory.
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --watch=false --coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-web
          path: web/coverage
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # Runs when the api or web job runs, and gates only the suites that ran (#169).
    # A skipped needed job would skip this one by default, hence the explicit if.
    needs: [changes, api, web]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.run_coverage != 'false'
      && contains(fromJSON('["success", "skipped"]'), needs.api.result)
      && contains(fromJSON('["success", "skipped"]'), needs.web.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # _base is BASE_SHA (PR base or event.before). Floor, thresholds, and the
      # gate script come from _base so the commit under test cannot rewrite its
      # own floor (R5-M1 / R104-M1). persist-credentials stays false.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: _base
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # A suite that ran must have its artifact: download fails if it is missing.
      - if: needs.changes.outputs.run_api != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-dotnet
          path: TestResults/coverage
      - if: needs.changes.outputs.run_web != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-web
          path: web/coverage
      - name: Coverage gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_API: ${{ needs.changes.outputs.run_api }}
          RUN_WEB: ${{ needs.changes.outputs.run_web }}
        run: |
          # A suite that did not run is skipped by the gate, not passed on stale data.
          SUITES=""
          if [ "$RUN_API" != false ]; then SUITES=dotnet; fi
          if [ "$RUN_WEB" != false ]; then SUITES="${SUITES:+$SUITES,}web"; fi
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::BASE_SHA is missing (merge-base unresolved). Failing closed."
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules "$PWD/_base" "$BASE_SHA"
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Cannot resolve BASE_SHA ${BASE_SHA}. Failing closed."
            exit 1
          fi
          # The gate exists on main since #5 (741b19eb). Never run the head copy:
          # a BASE_SHA without the gate (retarget, stale base, deleted gate,
          # rewound main) fails closed here, before any code under test runs.
          GATE=_base/perf/coverage-gate.mjs
          if [ ! -f "$GATE" ]; then
            echo "::error::BASE_SHA ${BASE_SHA} has no perf/coverage-gate.mjs. Bootstrap closed after #5; rebase onto main. Failing closed."
            exit 1
          fi
          node "$GATE" \
            --dotnet TestResults/coverage \
            --web web/coverage \
            --base "$BASE_SHA" \
            --base-dir _base \
            --default-dir _base \
            --default-sha "$BASE_SHA" \
            --default-branch "$DEFAULT_BRANCH" \
            --base-ref "${GITHUB_BASE_REF:-}" \
            --event "${GITHUB_EVENT_NAME:-}" \
            --suites "$SUITES"

  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Gate script tests (≥80% line/branch)
        run: |
          set -o pipefail
          node --test --experimental-test-coverage \
            --test-coverage-lines=80 --test-coverage-branches=80 \
            --test-coverage-include=perf/coverage-gate.mjs \
            perf/coverage-gate.test.mjs | tee /tmp/gate-tests.out
          {
            echo "## Gate script coverage"
            echo
            echo '```'
            awk '/start of coverage report/,/end of coverage report/' /tmp/gate-tests.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Change classifier tests (#169, ≥80% line/branch)
        run: |
          set -o pipefail
          node --test --experimental-test-coverage \
            --test-coverage-lines=80 --test-coverage-branches=80 \
            --test-coverage-include=.github/scripts/ci-changes.mjs \
            .github/scripts/ci-changes.test.mjs | tee /tmp/changes-tests.out
          {
            echo "## Change classifier coverage"
            echo
            echo '```'
            awk '/start of coverage report/,/end of coverage report/' /tmp/changes-tests.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compose-smoke:
    # The same checks the deploy smoke test runs against Render, here against the built image.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [changes, api, web]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.run_compose_smoke != 'false'
      && contains(fromJSON('["success", "skipped"]'), needs.api.result)
      && contains(fromJSON('["success", "skipped"]'), needs.web.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate a throwaway local password (never stored)
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "POSTGRES_PASSWORD=$pw" > .env
      - env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose up -d --build
      - name: Smoke
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          i=0
          while [ "$i" -lt 60 ]; do
            if curl -fsS --max-time 10 localhost:8080/health > health.json; then
              break
            fi
            i=$((i + 1))
            sleep 2
          done
          test -s health.json
          cat health.json
          test "$(jq -r .version health.json)" = "$EXPECT_SHA"
          root_code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' localhost:8080/)
          me_code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' localhost:8080/api/me)
          echo "GET / -> $root_code"
          echo "GET /api/me -> $me_code"
          test "$root_code" = 200
          test "$me_code" = 401
      - if: failure()
        run: docker compose logs

  budgets:
    # README §10 / §14.1 step 9: P1 first-block payload budgets on the compose stack, seeded at scale 1.0.
    # Fails above the "Risk" budget (60 KB on the wire); warns above "All" (250 KB). Then #43 AC4 (#134): with 18k+
    # rows, the last block and every summary SUM equal independent SQL. No secrets: the database password and the
    # throwaway account's password are generated per run and masked.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: [changes, api, web]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.run_budgets != 'false'
      && contains(fromJSON('["success", "skipped"]'), needs.api.result)
      && contains(fromJSON('["success", "skipped"]'), needs.web.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: ./.github/actions/build-db-tools
      - name: Generate a throwaway local password (never stored)
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "POSTGRES_PASSWORD=$pw" > .env
      - env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose up -d --build
      - name: Migrate and seed (scale 1.0)
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL="Host=localhost;Port=5432;Database=creditdesk;Username=desk;Password=$POSTGRES_PASSWORD"
          for _ in $(seq 1 30); do docker compose exec -T postgres pg_isready -U desk -d creditdesk && break; sleep 2; done
          dbtools/efbundle
          dbtools/seeder/Desk.Seeder --force --scale 1.0
      - name: Payload budgets and the 18k+ last block
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL="Host=localhost;Port=5432;Database=creditdesk;Username=desk;Password=$POSTGRES_PASSWORD"
          # A throwaway viewer for this run; the CLI prints its generated password once, captured and masked here.
          out=$(dotnet run -c Release --project src/Desk.UserAdmin -- add --email budgets@example.com --role viewer --expires 2099-12-31)
          DESK_PASSWORD=$(printf '%s\n' "$out" | sed -n 's/^Password (shown once, share it out of band): //p')
          test -n "$DESK_PASSWORD" # fail loudly if the CLI's output format changes
          echo "::add-mask::$DESK_PASSWORD"
          for _ in $(seq 1 60); do curl -fsS --max-time 5 localhost:8080/health >/dev/null && break; sleep 2; done
          BASE_URL=http://localhost:8080 DESK_EMAIL=budgets@example.com DESK_PASSWORD="$DESK_PASSWORD" \
            node perf/payload-size.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          # #43 AC4: exits 1 on any mismatch (pipefail keeps that through tee).
          BASE_URL=http://localhost:8080 DESK_EMAIL=budgets@example.com DESK_PASSWORD="$DESK_PASSWORD" \
            dotnet run -c Release --project perf/LastBlockCheck | tee -a "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs

  e2e:
    # README §11 / §14.1 step 10: Playwright against the compose stack seeded at scale 0.2, logged in as a
    # throwaway viewer (generated, masked password). Uploads the report and the dark/light screenshots.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [changes, api, web]
    if: >-
      ${{ !cancelled()
      && needs.changes.outputs.run_e2e != 'false'
      && contains(fromJSON('["success", "skipped"]'), needs.api.result)
      && contains(fromJSON('["success", "skipped"]'), needs.web.result) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: ./.github/actions/build-db-tools
      - name: Generate a throwaway local password (never stored)
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "POSTGRES_PASSWORD=$pw" > .env
      - env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose -f docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build
      - name: Migrate, seed (scale 0.2) and create a throwaway viewer
        run: |
          set -a; . ./.env; set +a
          export DATABASE_URL="Host=localhost;Port=5432;Database=creditdesk;Username=desk;Password=$POSTGRES_PASSWORD"
          for _ in $(seq 1 30); do docker compose exec -T postgres pg_isready -U desk -d creditdesk && break; sleep 2; done
          dbtools/efbundle
          dbtools/seeder/Desk.Seeder --force --scale 0.2
          out=$(dotnet run -c Release --project src/Desk.UserAdmin -- add --email e2e@example.com --role viewer --expires 2099-12-31)
          pw=$(printf '%s\n' "$out" | sed -n 's/^Password (shown once, share it out of band): //p')
          test -n "$pw" # fail loudly if the CLI's output format changes
          echo "::add-mask::$pw"
          echo "DESK_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          DESK_EMAIL: e2e@example.com
        run: |
          for _ in $(seq 1 60); do curl -fsS --max-time 5 localhost:8080/health >/dev/null && break; sleep 2; done
          npx playwright test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            docs/screenshots
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs

  db-tools:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_db_tools != 'false' }}
    # Build-only rehearsal of deploy/db-ops (README §14.2 / §14.3): same composite
    # action, clean checkout, no prior restore/build, no secrets, no production
    # environment, no database. The api job also calls this action, but only after
    # `dotnet build`, which hid NETSDK1004 on production's first real release.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build migrations bundle and seeder
        uses: ./.github/actions/build-db-tools
      - name: Assert artifacts
        run: |
          test -x dbtools/efbundle
          test -x dbtools/seeder/Desk.Seeder
