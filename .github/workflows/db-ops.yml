name: DB ops

# README §14.3: manual, guarded operations on the production database.
# DATABASE_URL is only injected on the steps that talk to Neon. Dispatch is
# refused unless the run is from refs/heads/main (case-sensitive) at the current tip.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: What to run
        type: choice
        options: [size-report, migrate, reseed]
        default: size-report
      scale:
        description: Seed scale (reseed only)
        default: "1.0"
      cap_mb:
        description: Reseed peak cap in MB (reseed only; refused with exit 2 above it, README §10)
        default: "512"
      confirm:
        description: Type RESEED-PRODUCTION to allow a reseed
        default: ""

# #242: the `production` group sits on the run job (the one that reaches Neon), as in deploy.yml, not on the
# workflow. A workflow-level group made this run pending the moment it was dispatched, and a newly pending run
# replaces the group's pending one: a db-ops dispatch could cancel the tip's pending Deploy release. The gate
# runs outside the group and refuses while a Deploy run is still in flight, before this run enters it.

permissions:
  contents: read

# Explicit `bash` is `bash --noprofile --norc -eo pipefail`, so `case … | tee`
# fails the step when migrate/seed/size-report exits non-zero.
defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list Deploy runs (read-only)
    outputs:
      allowed: ${{ steps.tip.outputs.allowed }}
    steps:
      - name: Require exact main tip
        id: tip
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::DB ops is only allowed from refs/heads/main (this run is $REF)."
            exit 1
          fi
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/heads/main" --jq .sha)
          if [ -z "$tip" ] || [ "$tip" = null ]; then
            echo "::error::Could not resolve the current tip of main."
            exit 1
          fi
          if [ "$SHA" != "$tip" ]; then
            echo "::notice::Skipping DB ops at $SHA; current tip of main is $tip. Re-runs of old runs are blocked."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### DB ops skipped: SHA is not the tip of main"
              echo
              echo "Run SHA: \`$SHA\`. Current tip: \`$tip\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refuse while a Deploy is in flight
        if: steps.tip.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any Deploy run not yet completed (queued, waiting, pending or in progress) may be holding or waiting for
          # the production group. Entering the group now could cancel its pending release (#242). Fails closed if
          # the list can't be read. Dispatch again when the Deploy has finished.
          active=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status != "completed") | .id] | length')
          if ! [[ $active =~ ^[0-9]+$ ]]; then
            echo "::error::Could not list Deploy runs; refusing DB ops (fail closed)."
            exit 1
          fi
          if [ "$active" -ne 0 ]; then
            echo "::error::A Deploy run is in flight ($active not completed). DB ops would share its production group and could cancel its pending release. Nothing was run; dispatch again after it finishes."
            exit 1
          fi

  run:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # Inputs go through env, never interpolated into scripts (script injection).
      OPERATION: ${{ inputs.operation }}
      SCALE: ${{ inputs.scale }}
      CAP_MB: ${{ inputs.cap_mb }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Confirm SHA is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/heads/main" --jq .sha)
          if [ -z "$tip" ] || [ "$tip" = null ]; then
            echo "::error::Could not resolve the current tip of main."
            exit 1
          fi
          if [ "$SHA" != "$tip" ]; then
            echo "::notice::Skipping DB ops at $SHA; current tip of main is $tip."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Guard
        if: steps.tip.outputs.allowed == 'true'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          [ -n "$NEON_DATABASE_URL" ] || { echo "::error::NEON_DATABASE_URL is not set (README §13.3)"; exit 1; }
          if [[ ! $SCALE =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::scale must be a non-negative number (e.g. 1 or 0.1), not '$SCALE'"
            exit 1
          fi
          if [[ ! $CAP_MB =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::cap_mb must be a positive whole number of MB (1-999999), not '$CAP_MB'"
            exit 1
          fi
          if [ "$OPERATION" = "reseed" ] && [ "$CONFIRM" != "RESEED-PRODUCTION" ]; then
            echo "::error::reseed requires confirm=RESEED-PRODUCTION"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.allowed == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-db-tools
        if: steps.tip.outputs.allowed == 'true'
      - name: Run
        if: steps.tip.outputs.allowed == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          case "$OPERATION" in
            migrate)     ./dbtools/efbundle ;;
            reseed)      ./dbtools/seeder/Desk.Seeder --force --scale "$SCALE" --cap-mb "$CAP_MB" ;;
            size-report) ./dbtools/seeder/Desk.Seeder --size-report ;;
            *) echo "::error::unknown operation: $OPERATION"; exit 1 ;;
          esac | tee out.txt
      - name: Summary
        if: always()
        env:
          ALLOWED: ${{ steps.tip.outputs.allowed }}
        run: |
          if [ "$ALLOWED" != true ]; then
            echo "### DB ops skipped: main moved" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "### DB ops: $OPERATION"; sed 's/^/    /' out.txt 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
