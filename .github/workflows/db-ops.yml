name: DB ops

# README §14.3: manual, guarded operations on the production database.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: What to run
        type: choice
        options: [size-report, migrate, reseed]
        default: size-report
      scale:
        description: Seed scale (reseed only)
        default: "1.0"
      confirm:
        description: Type RESEED-PRODUCTION to allow a reseed
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # Inputs go through env, never interpolated into scripts (script injection).
      OPERATION: ${{ inputs.operation }}
      SCALE: ${{ inputs.scale }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Guard
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::NEON_DATABASE_URL is not set (README §13.3)"; exit 1; }
          case "$SCALE" in ''|*[!0-9.]*) echo "::error::scale must be a number"; exit 1 ;; esac
          if [ "$OPERATION" = "reseed" ] && [ "$CONFIRM" != "RESEED-PRODUCTION" ]; then
            echo "::error::reseed requires confirm=RESEED-PRODUCTION"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-db-tools
      - name: Run
        run: |
          case "$OPERATION" in
            migrate)     ./dbtools/efbundle ;;
            reseed)      ./dbtools/seeder/Desk.Seeder --force --scale "$SCALE" ;;
            size-report) ./dbtools/seeder/Desk.Seeder --size-report ;;
          esac | tee out.txt
          { echo "### DB ops: $OPERATION"; sed 's/^/    /' out.txt; } >> "$GITHUB_STEP_SUMMARY"
