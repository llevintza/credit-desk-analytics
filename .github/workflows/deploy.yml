name: Deploy

# README §14.2: on a green CI run for main, migrate Neon -> seed if the seed version changed
# -> trigger the Render deploy hook -> wait until /health reports the merged commit.
#
# workflow_run.branches matches the *triggering run's head_branch*, so a pull_request CI
# run from a branch named "main" (including a fork's main) also matches. Jobs that reach
# the production environment / DATABASE_URL are therefore gated below on:
#   workflow_run: event == push, head_branch == main, head_repository == this repo, conclusion success
#   workflow_dispatch: github.ref == refs/heads/main (case-sensitive bash; GitHub == is not)
#   SHA being deployed == current tip of refs/heads/main (blocks re-runs of old CI/deploy)
# A SHA that is no longer the tip is skipped, not failed, so a lagging CI run does not
# paint the check red; the gate writes a warning and a "Deploy skipped" summary so the
# green run is not mistaken for a release (#207). Wrong-ref dispatch still fails.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# #207, #242: the `production` concurrency group sits on the release job only (migrate, seed,
# Render hook, smoke), not on the workflow. The gate and preflight run outside it, so a Deploy
# for a sha that is no longer the tip ends at the gate and never enters the group, where it
# would replace the tip's pending release; each run enters the group once. db-ops keeps the
# same group.

permissions:
  contents: read

# Explicit `bash` (not the unspecified default) is `bash --noprofile --norc -eo pipefail`.
# Without pipefail, `cmd | tee file` exits 0 even when cmd fails, so a failed migration
# would still seed and fire the Render hook (README §14.2 / §14.4).
defaults:
  run:
    shell: bash

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # No production environment and no secrets (only GITHUB_TOKEN). Case-sensitive ref
  # and "SHA is the tip of main" live here so a re-run of an old payload cannot reach Neon.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.tip.outputs.allowed }}
    steps:
      - name: Require exact main tip
        id: tip
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ "$REF" != refs/heads/main ]; then
                echo "::error::Deploy dispatch is only allowed from refs/heads/main (this run is $REF)."
                exit 1
              fi
              ;;
            workflow_run)
              if [ "$HEAD_BRANCH" != main ]; then
                echo "::error::Deploy workflow_run is only allowed for head_branch main (this run is $HEAD_BRANCH)."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected event $EVENT_NAME"
              exit 1
              ;;
          esac
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/heads/main" --jq .sha)
          if [ -z "$tip" ] || [ "$tip" = null ]; then
            echo "::error::Could not resolve the current tip of main."
            exit 1
          fi
          if [ "$SHA" != "$tip" ]; then
            # #207: a skip concludes success, so say so loudly; the tip's own Deploy releases.
            echo "::warning::Nothing deployed: $SHA is not the tip of main ($tip). The tip's own CI run deploys it."
            {
              echo "### Deploy skipped: ${SHA:0:7} is not the tip of main"
              echo "Nothing was migrated, seeded or released by this run. The current tip is \`${tip:0:7}\`; its own CI run triggers its Deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    environment: production
    # No production group here (#242): this job only checks that three values are set and touches neither Neon
    # nor Render. Holding the group here too let this run's own release, queued later, replace the tip's pending
    # preflight. Each run now enters the group once, in release.
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          missing=""
          [ -n "$NEON_DATABASE_URL" ] || missing="$missing NEON_DATABASE_URL"
          [ -n "$RENDER_DEPLOY_HOOK_URL" ] || missing="$missing RENDER_DEPLOY_HOOK_URL"
          [ -n "$APP_URL" ] || missing="$missing APP_URL"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped: production environment not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$missing. See README §13.3 for the one-time setup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [gate, preflight]
    if: needs.gate.outputs.allowed == 'true' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Confirm SHA is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/heads/main" --jq .sha)
          if [ -z "$tip" ] || [ "$tip" = null ]; then
            echo "::error::Could not resolve the current tip of main."
            exit 1
          fi
          if [ "$SHA" != "$tip" ]; then
            # #242: a skip concludes success, so say so loudly, as the gate does; the tip's own Deploy releases.
            echo "::warning::Nothing deployed: $SHA is not the tip of main ($tip). The tip's own Deploy releases it."
            {
              echo "### Deploy skipped: ${SHA:0:7} is not the tip of main"
              echo "main moved while this run waited for the production group. Nothing was migrated, seeded or released; the current tip is \`${tip:0:7}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.allowed == 'true'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - name: Build migrations bundle and seeder
        if: steps.tip.outputs.allowed == 'true'
        uses: ./.github/actions/build-db-tools

      - name: Migrate Neon
        if: steps.tip.outputs.allowed == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: ./dbtools/efbundle | tee migrate.txt

      - name: Seed (only if the seed version or scale changed)
        if: steps.tip.outputs.allowed == 'true'
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          SEED_SCALE: ${{ vars.SEED_SCALE || '1.0' }}
          # Reseed peak cap (#224, README §10): a run that would TRUNCATE is refused (exit 2) above it.
          # An --if-changed skip never checks it. 512 until Leo confirms the Neon cap.
          SEED_CAP_MB: ${{ vars.SEED_CAP_MB || '512' }}
        run: |
          if [[ ! $SEED_CAP_MB =~ ^[1-9][0-9]{0,5}$ ]]; then
            echo "::error::vars.SEED_CAP_MB must be a positive whole number of MB (1-999999), not '$SEED_CAP_MB' (README §14.2)"
            exit 1
          fi
          ./dbtools/seeder/Desk.Seeder --if-changed --scale "$SEED_SCALE" --cap-mb "$SEED_CAP_MB" | tee seed.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.allowed == 'true'
        with:
          node-version: 22

      # #302: the hook answers {"deploy":{"id":"dep-…"}}. render-deploy.mjs logs the id, adds it to the summary
      # and outputs it with the service id from the hook URL's path, so the smoke step never sees the hook URL.
      - name: Trigger Render deploy of this commit
        id: hook
        if: steps.tip.outputs.allowed == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          case "$HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS --max-time 30 -X POST "${HOOK}${sep}ref=${SHA}" > hook-response.json
          echo "Deploy requested for ${SHA}"
          node .github/scripts/render-deploy.mjs hook < hook-response.json

      - name: Smoke test (wait for the new build to serve /health)
        if: steps.tip.outputs.allowed == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          # #302: read only when the smoke fails. An empty key prints "could not be read (no API key)";
          # the smoke fails the same way either way.
          DEPLOY_ID: ${{ steps.hook.outputs.deploy_id }}
          SERVICE_ID: ${{ steps.hook.outputs.service_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          # Free-tier Docker builds plus cold start can take several minutes.
          v=""
          deadline=$(( $(date +%s) + 900 ))
          until [ "$(date +%s)" -ge "$deadline" ]; do
            v=$(curl -fsS --max-time 60 "$APP_URL/health" 2>/dev/null | jq -r .version || true)
            echo "live version: ${v:-<none>}"
            [ "$v" = "$SHA" ] && break
            sleep 15
          done
          if [ "$v" != "$SHA" ]; then
            echo "::error::$APP_URL did not report $SHA within 15 minutes"
            node .github/scripts/render-deploy.mjs status || true
            exit 1
          fi
          root_code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$APP_URL/")
          me_code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$APP_URL/api/me")
          echo "GET / -> $root_code"
          echo "GET /api/me -> $me_code"
          test "$root_code" = 200
          test "$me_code" = 401

      - name: Smoke test (Swagger UI and the OpenAPI document are not public)
        if: steps.tip.outputs.allowed == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # #110 (Helms ruling 3): #105 put Swagger behind the admin role, so an anonymous 2xx here
          # fails the deploy. Off (the prod default): both are 404. On (SWAGGER_ENABLED=true):
          # /swagger is a 301 to the public UI shell (ADR-0024; no redirect is followed) and the
          # document is 401. No answer (000) fails too: exposure could not be ruled out.
          exposed=0
          for path in /swagger /openapi/v1.json; do
            code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$APP_URL$path" || true)
            echo "GET $path -> $code"
            case "$code" in
              2??) echo "::error::$path answers $code without a session; Swagger UI and the OpenAPI document must not be public (#94, #105)"; exposed=1 ;;
              000|'') echo "::error::$path did not answer; could not rule out exposure"; exposed=1 ;;
            esac
          done
          exit "$exposed"

      - name: Summary
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL }}
          ALLOWED: ${{ steps.tip.outputs.allowed }}
        run: |
          # A skip is already explained by the tip step's warning and summary.
          if [ "$ALLOWED" != true ]; then
            exit 0
          fi
          {
            echo "### Deploy ${SHA:0:7}"
            echo "- URL: $APP_URL"
            echo "- Migrations:"; sed 's/^/    /' migrate.txt 2>/dev/null || true
            echo "- Seed:"; sed 's/^/    /' seed.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
