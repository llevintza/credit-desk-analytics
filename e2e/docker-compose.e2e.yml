# E2E override (README §11, CI `e2e` job): the same stack with higher per-user limits. One test account loads
# every page many times a minute, which the production limit (60/min, burst 20) would throttle. The limits stay
# on (AGENTS.md: off only in unit tests) — just sized for an automated user.
services:
  app:
    environment:
      RATE_LIMIT_PER_USER_PER_MIN: "6000"
      RATE_LIMIT_PER_USER_BURST: "1000"
      RATE_LIMIT_LOGIN_PER_IP_PER_MIN: "100"
