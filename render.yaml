# Render Blueprint (README §13.2). One Docker web service serves the SPA and the API from one origin; the same SPA
# is also on GitHub Pages and calls this API cross-origin (ADR-0024).
# Free tier: spins down after ~15 min idle; first request back takes 30-60 s. Use "starter" for always-on.
services:
  - type: web
    name: credit-desk-analytics
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /health
    # Deploys are triggered by GitHub Actions through the deploy hook, after migrations and seeding (README §14.2).
    autoDeploy: false
    envVars:
      # Neon DIRECT endpoint (not -pooler). URI or Npgsql keyword format both work. Set in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Turns on the host's X-Forwarded-Proto handling (X-Forwarded-For is stripped, so the remote address stays the
      # socket peer) and switches the always-on ClientAddress resolver into behind-proxy mode (ADR-0005, #116, #165).
      # Behind the proxy, headers count only from a private-address peer (Render's network) or one in
      # CLIENT_ADDRESS_TRUSTED_HOPS. Trailing private or trusted X-Forwarded-For hops are skipped, but a Cloudflare
      # hop always ends the skip. If the hop Render saw is a Cloudflare range, the client is CF-Connecting-IP (without
      # it, that edge: one shared key); otherwise the client is that hop. Unset, the socket peer is the client.
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      # CLIENT_ADDRESS_TRUSTED_HOPS (not listed, so it defaults to empty and nothing extra is trusted; unset is fine):
      # public proxy CIDRs between Cloudflare and the app, comma or space separated. A peer in them is believed and a
      # trailing hop in them is skipped, to fix a shared key the diagnostics show (#165) without a release. Set it in
      # the dashboard only; a sync keeps dashboard vars this file omits. Never list a range clients connect from.
      # Start-up fails on an entry wider than IPv4 /8 or IPv6 /32, or one that isn't a CIDR (a typo, a bare address,
      # bits past the prefix, an IPv4-mapped range), naming only that entry (#418, README §13.2).
      # A Blueprint sync writes every value: below back over the dashboard, MAINTENANCE_MODE included, so a
      # dashboard-only flip lasts until the next sync. Change the value here to keep it.
      - key: MAINTENANCE_MODE
        value: "false"
      # The GitHub Pages front end calls this API cross-origin with bearer tokens (ADR-0024). Exact origins only,
      # comma or space separated; unset allows none. The same-origin SPA served from this service doesn't need it.
      - key: CORS_ALLOWED_ORIGINS
        value: https://llevintza.github.io
      # README §7.2 limits; the code defaults match. A dashboard edit is overwritten by the next Blueprint sync (as
      # are all value: keys here, MAINTENANCE_MODE included), so tune them in this file.
      - key: RATE_LIMIT_PER_USER_PER_MIN
        value: "60"
      - key: RATE_LIMIT_GLOBAL_CONCURRENCY
        value: "8"
      - key: DEMO_ACCOUNTS_JSON
        sync: false
