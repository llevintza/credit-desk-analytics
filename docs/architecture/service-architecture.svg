<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .t{font-size:22px;font-weight:700;fill:#0f172a}
      .h{font-size:16px;font-weight:700;fill:#0f172a}
      .b{font-size:13.5px;fill:#334155}
      .s{font-size:12.5px;fill:#475569}
      .lab{font-size:12.5px;fill:#1e293b}
      .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;fill:#64748b}
    </style>
  </defs>
  <rect width="1500" height="860" fill="#ffffff"/>
  <text x="40" y="48" class="t">Credit Desk Analytics: service architecture</text>
  <text x="40" y="74" class="s">Start-of-day positions grid: 20,000 positions × ~200 columns, data refreshed once per business day</text>

  <!-- Browser -->
  <rect x="40" y="110" width="330" height="560" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="60" y="140" class="tag">BROWSER</text>
  <text x="60" y="166" class="h">Angular 22 SPA</text>
  <text x="60" y="192" class="b">Standalone components, signals,</text>
  <text x="60" y="211" class="b">OnPush, zoneless change detection</text>
  <rect x="60" y="232" width="290" height="150" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="76" y="258" class="h">AG Grid Community</text>
  <text x="76" y="282" class="b">Infinite Row Model: rows fetched</text>
  <text x="76" y="300" class="b">in blocks as the user scrolls</text>
  <text x="76" y="324" class="b">Column virtualization; only the</text>
  <text x="76" y="342" class="b">displayed columns are requested</text>
  <text x="76" y="366" class="b">Pinned totals row from the server</text>
  <rect x="60" y="398" width="290" height="104" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="76" y="424" class="h">Query streams (RxJS)</text>
  <text x="76" y="448" class="b">debounceTime on filters,</text>
  <text x="76" y="466" class="b">switchMap cancels stale requests,</text>
  <text x="76" y="484" class="b">bridged to signals (toSignal)</text>
  <rect x="60" y="518" width="290" height="132" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="76" y="544" class="h">Per-user column presets</text>
  <text x="76" y="568" class="b">Saved column sets, order, widths</text>
  <text x="76" y="586" class="b">and sort per user; quick filter;</text>
  <text x="76" y="604" class="b">CSV export; light / dark</text>
  <text x="76" y="622" class="b">trade-desk themes</text>

  <!-- Arrow browser -> service -->
  <line x1="372" y1="300" x2="468" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="380" y="262" class="lab">HTTPS,</text>
  <text x="380" y="279" class="lab">same origin</text>
  <text x="380" y="326" class="lab">httpOnly</text>
  <text x="380" y="343" class="lab">cookie</text>
  <text x="380" y="367" class="lab">gzip / br,</text>
  <text x="380" y="384" class="lab">ETag</text>

  <!-- Render service -->
  <rect x="470" y="110" width="560" height="660" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="490" y="140" class="tag">RENDER · ONE DOCKER WEB SERVICE</text>
  <text x="490" y="166" class="h">ASP.NET Core 10 minimal APIs + the built SPA (wwwroot)</text>

  <rect x="490" y="184" width="520" height="92" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="506" y="208" class="h">Request pipeline</text>
  <text x="506" y="232" class="b">Security headers / CSP → rate limiter (per user, per-IP login,</text>
  <text x="506" y="250" class="b">global DB concurrency 8 + queue) → cookie auth + antiforgery</text>
  <text x="506" y="268" class="b">→ maintenance switch (503 without touching the database)</text>

  <rect x="490" y="290" width="520" height="70" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="506" y="314" class="h">Endpoints</text>
  <text x="506" y="338" class="b">/api/auth · /api/positions (meta, block, summary, export)</text>
  <text x="506" y="356" class="b">· /api/presets · /health (static, never wakes the DB)</text>

  <rect x="760" y="374" width="250" height="196" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="776" y="398" class="h">Grid query builder</text>
  <text x="776" y="420" class="s">Dapper + Npgsql</text>
  <text x="776" y="444" class="b">Columns allow-listed</text>
  <text x="776" y="462" class="b">from the column catalog</text>
  <text x="776" y="486" class="b">Server-side sort, filter,</text>
  <text x="776" y="504" class="b">paging; parameterized SQL</text>
  <text x="776" y="528" class="b">Block size and column</text>
  <text x="776" y="546" class="b">count guarded; 10 s timeout</text>

  <rect x="490" y="374" width="250" height="196" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="506" y="398" class="h">Columnar response</text>
  <text x="506" y="420" class="s">System.Text.Json</text>
  <text x="506" y="444" class="b">Column list sent once,</text>
  <text x="506" y="462" class="b">values as arrays (no</text>
  <text x="506" y="480" class="b">repeated JSON keys)</text>
  <text x="506" y="504" class="b">Totals row returned with</text>
  <text x="506" y="522" class="b">the first block</text>

  <rect x="490" y="584" width="250" height="166" rx="8" fill="#fefce8" stroke="#facc15"/>
  <text x="506" y="608" class="h">In-memory cache</text>
  <text x="506" y="630" class="s">IMemoryCache</text>
  <text x="506" y="654" class="b">Keyed by as-of date; data</text>
  <text x="506" y="672" class="b">changes once a day, so a</text>
  <text x="506" y="690" class="b">repeat view never hits the DB</text>
  <text x="506" y="714" class="b">ETag → 304 Not Modified</text>

  <rect x="760" y="584" width="250" height="166" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="776" y="608" class="h">EF Core 10</text>
  <text x="776" y="630" class="s">stable model</text>
  <text x="776" y="654" class="b">ASP.NET Core Identity</text>
  <text x="776" y="672" class="b">(invite-only accounts),</text>
  <text x="776" y="690" class="b">presets, audit, column</text>
  <text x="776" y="708" class="b">catalog, migrations</text>

  <!-- Neon -->
  <rect x="1110" y="110" width="350" height="660" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1130" y="140" class="tag">NEON · POSTGRES 17</text>
  <text x="1130" y="166" class="h">One database, one schema per source</text>

  <rect x="1130" y="190" width="310" height="196" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="1146" y="216" class="h">core</text>
  <text x="1146" y="240" class="b">position_snapshot: wide,</text>
  <text x="1146" y="258" class="b">~200 columns, 20k rows per as-of</text>
  <text x="1146" y="282" class="b">position_history: narrow,</text>
  <text x="1146" y="300" class="b">24 month-ends</text>
  <text x="1146" y="324" class="b">fund, portfolio, deal (~1.5k),</text>
  <text x="1146" y="342" class="b">bond (~9k), trade (~150k),</text>
  <text x="1146" y="360" class="b">fund_performance</text>

  <rect x="1130" y="400" width="310" height="110" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-dasharray="5 4"/>
  <text x="1146" y="426" class="h">market · pricing ·</text>
  <text x="1146" y="446" class="h">surveillance · reference</text>
  <text x="1146" y="470" class="b">Separate connection strings, so</text>
  <text x="1146" y="488" class="b">each can move to its own DB</text>

  <rect x="1130" y="524" width="310" height="110" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="1146" y="550" class="h">auth / app</text>
  <text x="1146" y="574" class="b">Accounts, presets, audit,</text>
  <text x="1146" y="592" class="b">column catalog, seed metadata,</text>
  <text x="1146" y="610" class="b">data-protection keys</text>

  <!-- arrows service -> db -->
  <path d="M1010 420 C 1070 420, 1060 290, 1128 290" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="1022" y="352" class="lab">Dapper</text>
  <path d="M1010 680 C 1070 680, 1070 580, 1128 580" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="1036" y="700" class="lab">EF Core</text>
  <path d="M1010 520 C 1070 520, 1070 470, 1128 470" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ad)"/>
  <text x="1036" y="540" class="s">per-source,</text>
  <text x="1036" y="556" class="s">in parallel</text>

  <!-- legend -->
  <text x="40" y="815" class="s">Solid boxes and arrows: live today (positions page). Dashed: next pages on the roadmap (fund performance, multi-source insights board, deal explorer).</text>
  <text x="40" y="836" class="s">Local development runs the same container and Postgres 17 in Docker Compose, so production and local share one SQL dialect.</text>
</svg>
